# Proof that the submission runs — for anyone who would rather not install it.
#
# Not the tenant CI pipeline (that is ci.yml) and not the deploy pipeline
# (deploy.yml). This exists so a reviewer can see, from a green check and a job
# summary, that the platform boots and behaves the way the ADRs claim.
#
# It clones all four repositories, starts the whole local stack, and exercises the
# behaviours the design rests on — including the two that must FAIL.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}     # pipefail matters: `pytest | tee` would hide a failure

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the platform
        uses: actions/checkout@v4
        with:
          path: insights-hub/insights-platform

      # The four repos sit side by side; the local dev loop finds them by name.
      # In production none of this applies — the SDK is pip-installed.
      - name: Check out the SDK and both example apps
        working-directory: insights-hub
        run: |
          for r in insights-sdk insights-headcount-dashboard insights-comp-report; do
            echo "::group::clone $r"
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$r.git"
            echo "::endgroup::"
          done
          ls -la

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: false

      - name: Versions
        run: |
          uv --version
          python3 --version

      # ---- 1 · the test suite ------------------------------------------------
      - name: SDK tests
        id: tests
        working-directory: insights-hub/insights-sdk
        run: |
          uv run --no-project --with pytest --with pyyaml --with fastapi --with packaging \
            python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/tests.txt"

      - name: Platform tests
        working-directory: insights-hub/insights-platform
        run: |
          # The scheduler's run state. These fail if it ever goes back to being an
          # in-memory dict, which made `concurrency: forbid` and the fire-once-per-
          # minute dedupe true only within one process lifetime.
          uv run --no-project --with pytest --with fastapi --with httpx --with pyyaml \
            python -m pytest tests/ -q

      # ---- 2 · the manifest gates, on both example apps ----------------------
      - name: Local secrets come from each app's own .env
        working-directory: insights-hub
        run: |
          # .env is gitignored, so a fresh clone has none - which is the point: a
          # secret is the team's to set. CI does what a developer does.
          for app in insights-headcount-dashboard insights-comp-report; do
            [ -f "$app/.env.example" ] || { echo "::error::$app ships no .env.example"; exit 1; }
            cp "$app/.env.example" "$app/.env"
            sed -i 's/=$/=local-fake-value/' "$app/.env"
            git -C "$app" check-ignore -q .env \
              || { echo "::error::$app does not gitignore .env"; exit 1; }
          done
          echo "local secrets set from .env.example, and .env is ignored in both repos"

      - name: A committed .env is refused
        working-directory: insights-hub/insights-comp-report
        run: |
          # The one that matters: a credential in git is in the history forever.
          git add -f .env
          if INSIGHTS_REGISTRY_DIR=../insights-platform/control/registry \
               python ../insights-platform/control/cli/gates.py --app comp-report --manifest app.yaml; then
            echo "::error::the gate ACCEPTED a committed .env"; git reset -q .env; exit 1
          fi
          git reset -q .env
          echo "refused: a committed .env"

      - name: insights doctor
        working-directory: insights-hub
        run: |
          for app in insights-headcount-dashboard insights-comp-report; do
            echo "::group::doctor $app"
            cd "$app"
            # Sync and run as separate steps so a resolution failure is
            # distinguishable from a manifest failure. Guessing which one it was
            # from a single combined exit code cost a CI cycle once already.
            uv sync --quiet || { echo "::error::uv sync failed in $app"; uv sync; exit 1; }
            uv run insights doctor || {
              echo "::error::insights doctor failed in $app"
              echo "--- cwd ---";        pwd
              echo "--- siblings ---";   ls -la ..
              echo "--- registry ---";   ls -la ../insights-platform/control/registry || true
              echo "--- console script ---"; ls -la .venv/bin/insights || true
              exit 1
            }
            cd ..
            echo "::endgroup::"
          done

      # ---- 3 · a tenant cannot self-declare sensitivity ----------------------
      #        This must FAIL, so failing is the pass condition.
      - name: A tenant Dockerfile that breaks the rules is refused
        working-directory: insights-hub
        run: |
          # ADR-004 handed the image to tenants, so two properties that used to be
          # CONSTRUCTED are now CHECKED. A check that cannot fail is worse than no
          # check, so prove each one fails.
          cp insights-comp-report/Dockerfile "$RUNNER_TEMP/Dockerfile.orig"
          fails () {   # label, sed script
            sed -i "$2" insights-comp-report/Dockerfile
            if (cd insights-comp-report && INSIGHTS_REGISTRY_DIR=../insights-platform/control/registry \
                  python ../insights-platform/control/cli/gates.py --app comp-report --manifest app.yaml); then
              echo "::error::the gate ACCEPTED $1"; exit 1
            fi
            echo "refused: $1"
            cp "$RUNNER_TEMP/Dockerfile.orig" insights-comp-report/Dockerfile
          }
          grep -q '^FROM python:3.12-slim' insights-comp-report/Dockerfile \
            || { echo "::error::the base is not what this step assumes"; exit 1; }

          fails "an unpinned :latest base"  's|^FROM python:3.12-slim|FROM python:latest|'
          fails "an untagged base"          's|^FROM python:3.12-slim|FROM python|'
          fails "a final USER of root"      '$a\USER root'
          cp "$RUNNER_TEMP/Dockerfile.orig" insights-comp-report/Dockerfile

      - name: A manifest a tenant must not write is rejected
        working-directory: insights-hub/insights-headcount-dashboard
        run: |
          cp app.yaml "$RUNNER_TEMP/app.yaml.bak"
          restore() { cp "$RUNNER_TEMP/app.yaml.bak" app.yaml; }

          refuse () {   # label, sed script
            restore
            sed -i "$2" app.yaml
            if uv run insights doctor > "$RUNNER_TEMP/reject.txt" 2>&1; then
              echo "::error::ACCEPTED $1"; cat "$RUNNER_TEMP/reject.txt"; restore; exit 1
            fi
            echo "refused: $1"
          }

          # A credential in a file that lives in git forever.
          refuse "a password in a connection" \
            's|^    engine: rest$|    engine: rest\n    password: hunter2|'
          # Sensitivity is the data platform's to state, not a tenant's.
          refuse "a tenant-declared classification" \
            's|^    engine: rest$|    engine: rest\n    classification: internal|'
          # Fields removed from the schema are refused, never silently ignored.
          refuse "the removed runtime.sdk field" \
            's|^runtime:$|runtime:\n  sdk: ">=0.1,<1"|'
          refuse "the removed environments block" \
            '$a\environments:\n  prod: {approvers: owners}'
          restore

      # ---- 3b · a tenant repo must resolve ON ITS OWN ------------------------
      #
      # This job clones all four repos side by side, which is the platform team's
      # layout and NOT a tenant's. A tenant clones only their own repo. A path-based
      # dependency resolved fine here and failed for every real tenant, so this step
      # exists to make that impossible to reintroduce.
      - name: Every repo resolves with no sibling checkout
        run: |
          # Each of these must `uv sync` alone. The platform repo is in the list
          # because it is the one the README says to start with, so a path-based
          # dependency there fails for a reviewer before it fails for anyone else.
          for repo in insights-platform insights-headcount-dashboard insights-comp-report; do
            echo "::group::$repo, standalone"
            rm -rf "$RUNNER_TEMP/lone"
            mkdir -p "$RUNNER_TEMP/lone"
            cp -r "insights-hub/$repo" "$RUNNER_TEMP/lone/$repo"
            rm -rf "$RUNNER_TEMP/lone/$repo/.venv"
            (
              cd "$RUNNER_TEMP/lone/$repo"
              ls .. | grep -q insights-sdk && { echo "::error::sibling SDK present, test is void"; exit 1; }
              uv sync --quiet || { echo "::error::$repo cannot resolve standalone"; uv sync; exit 1; }
            )
            echo "$repo resolved with no sibling checkout"
            echo "::endgroup::"
          done

      # ---- 4 · the scheduled job, end to end ---------------------------------
      - name: Run the scheduled job
        working-directory: insights-hub/insights-comp-report
        run: |
          uv run insights run 2>&1 | tee "$RUNNER_TEMP/job.jsonl"
          grep -q '"event": "connection_opened"' "$RUNNER_TEMP/job.jsonl"
          grep -q '"event": "query_executed"'    "$RUNNER_TEMP/job.jsonl"
          grep -q '"event": "output_written"'    "$RUNNER_TEMP/job.jsonl"
          grep -q '"event": "job_complete"'      "$RUNNER_TEMP/job.jsonl"

          # What a query record must NOT contain. The platform ships connectors and
          # never sees a row, so its own telemetry must not carry one either.
          if grep '"event": "query_executed"' "$RUNNER_TEMP/job.jsonl" | grep -qiE 'SELECT|base_salary'; then
            echo "::error::a query record leaked SQL or a column name"; exit 1
          fi

      # ---- 5 · the web path, through the edge --------------------------------
      - name: Boot the platform, serve an app, exercise the web path
        working-directory: insights-hub
        run: |
          # `up` starts the PLATFORM only. Apps are independent: each runs in its own
          # repo via `insights serve` and registers itself live. This step proves both
          # halves, in the order a person would do them.
          (cd insights-platform && uv run insights up --port 9000 > "$RUNNER_TEMP/up.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -sf http://localhost:9000/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:9000/ >/dev/null \
            || { echo "::error::edge never came up"; cat "$RUNNER_TEMP/up.log"; exit 1; }

          # The console is the one app the platform runs, and it must work with zero
          # tenant apps present.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:9000/apps/console/?as=suraj@corp.example")
          [ "$code" = 303 ] || [ "$code" = 200 ] \
            || { echo "::error::console returned $code with no apps running"; exit 1; }

          (cd insights-headcount-dashboard && uv run insights serve --edge 9000 --port 9101 \
             > "$RUNNER_TEMP/serve.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -sf http://localhost:9101/healthz >/dev/null && break; sleep 1; done
          curl -sf http://localhost:9101/healthz >/dev/null \
            || { echo "::error::app never came up"; cat "$RUNNER_TEMP/serve.log"; exit 1; }

          B=http://localhost:9000/apps/headcount-dashboard
          J="$RUNNER_TEMP/jar.txt"
          S="$RUNNER_TEMP/steps.md"; : > "$S"
          ok() { echo "| $1 | ✅ $2 |" >> "$S"; echo "PASS: $1"; }
          no() { echo "::error::$1"; cat "$RUNNER_TEMP/up.log" "$RUNNER_TEMP/serve.log"; exit 1; }

          # An app registered by `serve` is reachable through the edge with NO restart.
          code=$(curl -s -L -c "$J" -b "$J" "$B/?as=krishna@corp.example" -o /dev/null -w '%{http_code}')
          [ "$code" = 200 ] && ok "An app registers itself live" "$code" || no "sign-in returned $code"

          curl -s -b "$J" "$B/api/me" | grep -q '"trusted":true' \
            && ok "Identity is established by the edge" "trusted" || no "identity not trusted"

          curl -s -b "$J" -H 'X-Auth-User: ceo@corp.example' -H 'X-Auth-Groups: admin' \
               "$B/api/me" | grep -q 'krishna@corp.example' \
            && ok "Forged identity headers are stripped" "still krishna" || no "forged headers were honoured"

          curl -s -b "$J" "$B/api/headcount?month=2026-09" | grep -q 'Engineering' \
            && ok "Reads its warehouse through a connector" "rows" || no "warehouse read failed"

          curl -s -b "$J" "$B/api/team?dept=Engineering" | grep -q 'kishore@corp.example' \
            && ok "Reads an internal REST API" "rows" || no "REST read failed"

          curl -s -b "$J" "$B/healthz" | grep -q '"status":"ok"' \
            && ok "Health opens every declared connection" "ok" || no "health check failed"

          curl -s -L -c "$RUNNER_TEMP/j2" -b "$RUNNER_TEMP/j2" "$B/?as=vidya@corp.example" -o /dev/null
          curl -s -b "$RUNNER_TEMP/j2" "$B/api/headcount" | grep -q 'not a member' \
            && ok "A user outside the app is refused" "403" || no "a user outside the app was allowed"

          # Running outside the edge is not "an app with no user" - it is an app where
          # every check returns no, including the data path.
          curl -s http://localhost:9101/api/me | grep -q '"trusted":false' \
            && ok "Bypassing the edge yields nothing" "anonymous" || no "direct access was trusted"

      # ---- 6 · the evidence a reviewer would be handed -----------------------
      - name: Compliance report
        working-directory: insights-hub/insights-platform
        run: uv run insights compliance-report 2>&1 | tee "$RUNNER_TEMP/compliance.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Insights Hub — verified"
            echo
            echo "| Behaviour | Result |"
            echo "|---|---|"
            cat "$RUNNER_TEMP/steps.md" 2>/dev/null || echo "| the stack did not start | ❌ |"
            echo
            echo "### Tests"
            echo '```'
            tail -3 "$RUNNER_TEMP/tests.txt" 2>/dev/null || echo "(did not run)"
            echo '```'
            echo "### Evidence handed to a compliance reviewer"
            echo '```'
            cat "$RUNNER_TEMP/compliance.txt" 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Move the platform's own `v1` tag when main is green.
  #
  # Every tenant pipeline is four lines calling this repo's reusable workflows at
  # @v1, so a stale tag means every tenant runs a stale CI - with the OLD gate
  # rules, silently. It was 28 commits behind when someone noticed, because moving
  # it was a manual step nobody had written down.
  #
  # Now it is not a step anybody has to remember. Same floor-not-pin argument as
  # the SDK's v1 (ADR-001): the tag MOVES within the major line, and a breaking
  # change to the reusable workflows means cutting v2.
  # ---------------------------------------------------------------------------
  tag:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1 -m "Moving major tag. Tenant pipelines call this repo's
          reusable workflows at @v1; it moves within the major line."
          git push -f origin v1
          echo "v1 -> $(git rev-parse --short HEAD)"

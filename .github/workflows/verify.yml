# Proof that the submission runs — for anyone who would rather not install it.
#
# This is not the tenant CI pipeline (that is ci.yml) and not the deploy pipeline
# (deploy.yml). It exists so a reviewer can see, from a green check and a job
# summary, that the platform actually boots and behaves as the ADRs claim.
#
# It clones all four repositories, starts the whole local stack, and exercises the
# behaviours the design rests on — including the ones that must FAIL.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the platform
        uses: actions/checkout@v4
        with: {path: insights-hub/insights-platform}

      # The four repos sit side by side. The local dev loop finds them by name -
      # in production none of this applies, because the SDK is pip-installed.
      - name: Check out the SDK and both example apps
        run: |
          cd insights-hub
          for r in insights-sdk insights-headcount-dashboard insights-comp-report; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$r.git"
          done

      - uses: astral-sh/setup-uv@v5
        with: {version: "0.5.11"}

      # ---- 1. the test suite -------------------------------------------------
      - name: SDK tests
        working-directory: insights-hub/insights-sdk
        run: |
          uv run --no-project --with pytest --with pyyaml --with fastapi \
            python -m pytest -q | tee "$RUNNER_TEMP/tests.txt"

      # ---- 2. the manifest gates, on both example apps -----------------------
      - name: insights doctor
        working-directory: insights-hub
        run: |
          for app in insights-headcount-dashboard insights-comp-report; do
            (cd "$app" && ../insights-platform/dev doctor)
          done

      # ---- 3. a tenant cannot self-declare sensitivity -----------------------
      #        This one has to FAIL, so failing is the pass condition.
      - name: A manifest declaring classification is rejected
        working-directory: insights-hub/insights-headcount-dashboard
        run: |
          cp app.yaml "$RUNNER_TEMP/app.yaml.bak"
          printf '\n# injected by the verify workflow\n' >> app.yaml
          python - <<'PY'
          import pathlib
          p = pathlib.Path("app.yaml"); t = p.read_text()
          p.write_text(t.replace("  - dataset: hr.headcount",
                                 "  - dataset: hr.headcount\n    classification: internal"))
          PY
          if ../insights-platform/dev doctor 2>/dev/null; then
            echo "::error::a manifest declaring classification was ACCEPTED"; exit 1
          fi
          echo "correctly rejected"
          cp "$RUNNER_TEMP/app.yaml.bak" app.yaml

      # ---- 4. the scheduled job, end to end ----------------------------------
      - name: Run the scheduled job
        working-directory: insights-hub/insights-comp-report
        run: |
          ../insights-platform/dev run | tee "$RUNNER_TEMP/job.jsonl"
          grep -q '"via_grant": true'  "$RUNNER_TEMP/job.jsonl"   # the owner's grant applied
          grep -q '"event": "output_written"' "$RUNNER_TEMP/job.jsonl"
          grep -q '"event": "job_complete"'   "$RUNNER_TEMP/job.jsonl"

      # ---- 5. the web app, through the edge ----------------------------------
      - name: Boot the platform and exercise the web path
        working-directory: insights-hub/insights-platform
        run: |
          ./dev up --port 9000 > "$RUNNER_TEMP/up.log" 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:9000/ >/dev/null && break || sleep 1
          done

          B=http://localhost:9000/a/headcount-dashboard
          J="$RUNNER_TEMP/jar.txt"; S="$RUNNER_TEMP/steps.md"
          : > "$S"

          pass() { echo "| $1 | $2 |" >> "$S"; }

          # sign in and fetch the frontend
          code=$(curl -s -L -c "$J" -b "$J" "$B/?as=dana@corp.example" -o /dev/null -w '%{http_code}')
          [ "$code" = 200 ] && pass "Signs in and serves the app" "✅ $code"

          # identity arrived from the edge
          curl -s -b "$J" "$B/api/me" | grep -q '"trusted":true' \
            && pass "Identity is established by the edge" "✅ trusted"

          # a client cannot assert its own identity
          who=$(curl -s -b "$J" -H 'X-Auth-User: ceo@corp.example' \
                     -H 'X-Auth-Groups: comp-analyst' "$B/api/me")
          echo "$who" | grep -q 'dana@corp.example' \
            && pass "Forged identity headers are stripped" "✅ still dana"

          # the warehouse, brokered
          curl -s -b "$J" "$B/api/headcount?month=2026-09" | grep -q 'Engineering' \
            && pass "Reads the warehouse through the broker" "✅ rows"

          # the internal REST API — a different connection, same broker
          curl -s -b "$J" "$B/api/team?dept=Engineering" | grep -q 'lena@corp.example' \
            && pass "Reads the internal REST API" "✅ rows"

          # health resolves every declared dataset
          curl -s -b "$J" "$B/healthz" | grep -q '"status":"ok"' \
            && pass "Health check resolves every declared dataset" "✅ ok"

          # a trusted caller without the role is refused
          curl -s -L -c "$RUNNER_TEMP/j2" -b "$RUNNER_TEMP/j2" "$B/?as=sam@corp.example" -o /dev/null
          curl -s -b "$RUNNER_TEMP/j2" "$B/api/headcount" | grep -q 'not a member' \
            && pass "Wrong role is refused, naming the ADR" "✅ 403"

          [ "$(wc -l < "$S")" -eq 7 ] || { echo "::error::a behaviour check did not pass"; cat "$S"; exit 1; }

      # ---- 6. the evidence a reviewer would be handed ------------------------
      - name: Compliance report
        working-directory: insights-hub/insights-platform
        run: ./dev compliance-report --dataset hr.compensation | tee "$RUNNER_TEMP/compliance.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Insights Hub — verified"
            echo
            echo "| Behaviour | Result |"
            echo "|---|---|"
            cat "$RUNNER_TEMP/steps.md" 2>/dev/null || echo "| (stack did not start) | ❌ |"
            echo
            echo "### Tests"
            echo '```'; tail -3 "$RUNNER_TEMP/tests.txt" 2>/dev/null; echo '```'
            echo "### Evidence handed to a compliance reviewer"
            echo '```'; cat "$RUNNER_TEMP/compliance.txt" 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

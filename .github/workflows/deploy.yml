# The central reusable workflow. Every tenant's four-line CI file calls this.
#
# This is where ADR-004's "CI layer" lives: rules that must never SHIP, but that the SDK
# cannot enforce because they are about the manifest rather than about runtime behaviour.
# The platform owns this pipeline even though it does not own the tenant's code - which
# is the whole bargain: you own your code, we own the road it travels on.
#
# Improving any step here improves it for all 25 apps in one commit. That property is the
# main argument for the thin-caller pattern, and it is what makes a 3-person team viable.
name: deploy

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: local

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the platform registry
        uses: actions/checkout@v4
        with:
          repository: insights-hub/insights-platform
          path: .platform

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - run: pip install "insights-sdk>=0.1,<1"

      # One command, and it is the SAME command a tenant runs at their desk. If doctor
      # and CI could disagree, the tenant would learn the rules from CI failures - which
      # is the slowest possible feedback loop and the reason people resent platforms.
      - name: insights doctor
        env:
          INSIGHTS_REGISTRY_DIR: .platform/control/registry
          INSIGHTS_ENV: ${{ inputs.environment }}
        run: insights doctor

      # Checks that are specifically about SHIPPING, so they have no runtime equivalent.
      - name: Platform gates
        env:
          INSIGHTS_REGISTRY_DIR: .platform/control/registry
        run: |
          python .platform/control/cli/gates.py \
            --app "${{ inputs.app }}" \
            --manifest app.yaml \
            --dockerfile Dockerfile

      - name: Tenant tests
        run: |
          if [ -d tests ]; then pip install pytest && pytest -q; else echo "no tests"; fi

  build-and-register:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built FROM the platform base image, which carries the runtime, the SDK, the
      # non-root user and the entrypoint. A platform CVE is one base-image rebuild
      # rather than 25 pull requests.
      - name: Build
        run: docker build -t "insights-hub/${{ inputs.app }}:${{ github.sha }}" .

      - name: Register
        run: echo "would append ${{ inputs.app }} to control/registry/apps.json"

      - name: Deploy
        run: echo "would roll out ${{ inputs.app }} to ${{ inputs.environment }}"

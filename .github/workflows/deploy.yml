# Reusable deploy. Called by every tenant's deploy-dev / deploy-uat / deploy-prod.
#
# One workflow, three environments. The environment name is the ONLY difference a
# tenant passes, and everything that varies by environment - approvers, the AWS
# account, the registry, whether a schedule is armed - is resolved platform-side
# from app.yaml. A tenant cannot grant themselves a production deploy by editing
# their own pipeline, because their pipeline is four lines and calls this.
name: deploy

on:
  workflow_call:
    inputs:
      app:         {required: true,  type: string}
      environment: {required: true,  type: string}   # dev | uat | prod
      ref:         {required: false, type: string}   # promote an existing build

permissions:
  id-token: write        # GitHub OIDC -> AWS. No long-lived keys anywhere.
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Re-run every CI gate. A promotion must not be able to skip validation
  #    just because someone clicked a button in a different workflow.
  # ---------------------------------------------------------------------------
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      app: ${{ inputs.app }}

  # ---------------------------------------------------------------------------
  # 2. Build once, in dev. uat and prod PROMOTE that artefact - they never
  #    rebuild. If prod rebuilt, prod would be running code no one tested.
  # ---------------------------------------------------------------------------
  build:
    needs: validate
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_DEV }}:role/insights-deploy
          aws-region: eu-west-1
      - uses: aws-actions/amazon-ecr-login@v2

      # Build the TENANT'S Dockerfile. The platform does not render one and does
      # not publish a base image (ADR-004) - CI has already checked the two things
      # that matter: the base is pinned, and the final USER is not root.
      - id: push
        run: |
          IMAGE="$ECR/insights/${{ inputs.app }}:${{ github.sha }}"
          docker build -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 3. Release. `environment:` is what makes GitHub enforce the approval gate.
  #    The reviewer list is reconciled by the platform from access.manage in
  #    app.yaml - it is NOT configured in the tenant repo, so ownership of the
  #    app and the right to promote it cannot drift apart.
  # ---------------------------------------------------------------------------
  release:
    needs: [validate, build]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}      # <- the approval gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars[format('AWS_ACCOUNT_{0}', inputs.environment)] }}:role/insights-deploy
          aws-region: eu-west-1

      # Reconcile everything app.yaml declared into things that actually exist.
      # This is where the manifest stops being a document and becomes infrastructure.
      - name: Reconcile from the manifest
        run: |
          uv run python .platform/control/cli/reconcile.py \
            --app "${{ inputs.app }}" --env "${{ inputs.environment }}" --manifest app.yaml
          # - access.manage         -> the edge's authz table (union of the tiers),
          #                            GitHub environment reviewers, IAM trust
          # - connections[].secret  -> secret slots insights/<app>/<name>, readable
          #                            by the app's own task role (sp-<app>) only
          # - runtime.size          -> ECS cpu/memory/desired count
          # - web.route             -> a route in the edge's table (one ALB rule -> edge)
          # - job.*                 -> EventBridge Scheduler (schedule, timezone, timeout,
          #                            retries, concurrency, catchup)
          # - output() artefacts    -> S3 prefix + lifecycle rule

      - name: Deploy
        run: |
          uv run python .platform/control/cli/deploy.py \
            --app "${{ inputs.app }}" --env "${{ inputs.environment }}" \
            --image "${{ needs.build.outputs.image }}"

      - name: Register
        run: |
          uv run python .platform/control/cli/register.py \
            --app "${{ inputs.app }}" --env "${{ inputs.environment }}" \
            --image "${{ needs.build.outputs.image }}" --sha "${{ github.sha }}"

      # A deploy that starts and then fails on first use is the classic silent
      # failure. /healthz resolves every declared dataset and checks its
      # credential was injected, so we find out here instead of at 06:00.
      - name: Verify
        run: |
          uv run python .platform/control/cli/verify.py \
            --app "${{ inputs.app }}" --env "${{ inputs.environment }}" --timeout 120

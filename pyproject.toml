# The platform repo is a uv project so that `uv run insights ...` works here exactly as
# it does in a tenant repo. One command name everywhere.
[project]
name = "insights-platform"
version = "0.1.0"
description = "The Insights Hub platform: runtime, control plane, and the reusable pipelines."
requires-python = ">=3.12"

dependencies = [
  "insights-sdk>=0.1,<1",   # a FLOOR, not a pin - same contract as a tenant (ADR-001)
  "fastapi>=0.110",         # the edge
  "uvicorn>=0.27",
  "httpx>=0.27",            # the edge proxies with it
  "pyyaml>=6.0",
  "packaging>=24.0",        # control/cli/gates.py resolves version ranges
]

[tool.uv]
package = false             # a deployable, not a library

# ---------------------------------------------------------------------------
# WHERE THE SDK COMES FROM
#
# Same rule as a tenant repo, and for the same reason: anyone who clones ONLY this
# repo must be able to `uv sync`. This is the repo the README calls "start here",
# so a local path here fails for a reviewer before it fails for anyone else.
#
# The version range above is the contract. This block only says where to FETCH a
# version satisfying it. With an internal package index the block is deleted and
# the index is configured once for everyone; until then the moving `v1` tag stands
# in - re-locking picks up patches and minors, and a breaking change means v2.
#
# DEVELOPING THE PLATFORM AND THE SDK TOGETHER
# Point at your local checkout explicitly, without editing this file:
#
#     uv run --with-editable ../insights-sdk insights status
#
# That overlays your checkout for one command, with no state to forget to undo.
# `uv pip install -e ../insights-sdk` does NOT work on its own: `uv run` re-syncs
# the project before every command and silently reverts it. If you want it to
# stick for a session, add `--no-sync` or export UV_NO_SYNC=1.
#
# Opt in when you need it, rather than making everyone else's clone depend on your
# directory layout.
# ---------------------------------------------------------------------------
[tool.uv.sources]
insights-sdk = { git = "https://github.com/KRISHNABR/insights-sdk.git", tag = "v1" }

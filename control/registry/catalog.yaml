# The access registry. Platform-owned; tenants cannot edit it.
#
# READ THIS FIRST, because the shape of this file is a decision (ADR-002 s2):
#
#   This is NOT the source of truth for governance. Unity Catalog is.
#   Who owns a table, how sensitive it is, who may read which columns and which
#   rows - all of that lives in Unity Catalog, where it is enforced on every path
#   to the data including a notebook, not just on ours.
#
#   This file is a PROJECTION. It holds only what the APPLICATION layer needs:
#     * a nickname, so tenant SQL is portable across environments
#     * where that nickname points in each environment
#     * an owner, so a request for access can be routed to a human
#
#   What is deliberately NOT here any more: `classification` and `masking`. They
#   were here in an earlier version and were removed - a governance model
#   maintained beside Unity Catalog's is a second source of truth, and second
#   sources of truth drift silently.
#
# Not a data catalog either: no search, no schema browser, no lineage, no sample
# rows. Discovery belongs in Unity Catalog, which already has those governed by
# the same grants. See ADR-002 s5.

# ---------------------------------------------------------------------------
# Shared connections - operated by the platform, never exposed to tenant code.
# Nobody is ever granted a connection; access is granted per dataset, in UC.
# ---------------------------------------------------------------------------
connections:

  lakehouse:
    engine: databricks               # -> query(dataset, sql, **params)
    description: The company lakehouse.
    governance: external             # Unity Catalog enforces grants, masks and
                                     # row filters. The broker does NOT.
    environments:
      # No credential reference: there is no stored secret. Interactive apps use
      # OAuth token exchange so UC sees the real person; jobs use workload
      # identity federation from their task role. See ADR-002 s3.
      dev:
        host_env: DATABRICKS_HOST
        warehouse_env: DATABRICKS_WAREHOUSE_ID
        auth: oauth-federated
      prod:
        host_env: DATABRICKS_HOST
        warehouse_env: DATABRICKS_WAREHOUSE_ID
        auth: oauth-federated
      # Local development. Postgres is the closest honest stand-in: it has real
      # users and real GRANTs, so the restricted-data behaviour can be
      # DEMONSTRATED rather than described. It is not Unity Catalog - column
      # masks are approximated with views and column privileges, so governance
      # behaviour is only exactly right against a real workspace.
      local:
        dsn_env: INSIGHTS_WAREHOUSE_DSN
        governance: local-approximation

  directory-api:
    engine: rest                     # -> fetch(dataset, params=...)
    description: The internal employee directory service.
    governance: none                 # a plain internal service; entitlement is
                                     # enforced by the broker alone
    environments:
      local: {base_url_env: INSIGHTS_DIRECTORY_URL, token_env: INSIGHTS_DIRECTORY_TOKEN}
      dev:   {base_url_env: INSIGHTS_DIRECTORY_URL, token_env: INSIGHTS_DIRECTORY_TOKEN}
      prod:  {base_url_env: INSIGHTS_DIRECTORY_URL, token_env: INSIGHTS_DIRECTORY_TOKEN}

# ---------------------------------------------------------------------------
# Datasets - the nickname an app declares, and where it points.
#
#   owner      mirrors the Unity Catalog object owner. Kept here only so the CLI
#              can tell a team WHO to ask; UC remains authoritative.
#   locations  the three-level UC name per environment. This is the whole reason
#              the nickname exists: `hr.headcount` is one table in dev and
#              another in prod, and tenant SQL never learns which.
# ---------------------------------------------------------------------------
datasets:

  hr.headcount:
    description: Headcount by department and month.
    connection: lakehouse
    owner: MG-PEOPLE-OPS
    locations:
      local: {table: hr_headcount}
      dev:   {uc: hr_dev.people.headcount}
      prod:  {uc: hr_prod.people.headcount}

  hr.compensation:
    description: Individual compensation records.
    connection: lakehouse
    owner: MG-PEOPLE-ANALYTICS
    # Sensitivity is a Unity Catalog tag (sensitivity=restricted), not a field
    # here. Column masks on employee_name and base_salary are UC masking
    # functions. Both are enforced by UC for every reader, including notebooks.
    locations:
      local: {table: hr_compensation}
      dev:   {uc: hr_dev.people.compensation}
      prod:  {uc: hr_prod.people.compensation}
    # Local-only: the approximation of UC's column masks, so the behaviour is
    # demonstrable on a laptop. Ignored entirely when governance is external.
    local_masking:
      employee_name: comp-analyst
      base_salary:   comp-analyst
    # Field names asserted absent from telemetry emitted by any app that reads
    # this dataset (ADR-003). This one IS ours: it is about our log pipeline,
    # not about the data platform.
    sensitive_fields: [employee_id, employee_name, base_salary, bonus_pct]

  directory.people:
    description: Employee name and department lookup.
    connection: directory-api
    owner: MG-PEOPLE-OPS
    locations:
      local: {resource: /people}
      dev:   {resource: /v1/people}
      prod:  {resource: /v1/people}

  sales.pipeline:
    description: Open opportunities by region.
    connection: lakehouse
    owner: MG-SALES-OPS
    locations:
      local: {table: sales_pipeline}
      dev:   {uc: sales_dev.crm.pipeline}
      prod:  {uc: sales_prod.crm.pipeline}
    # Deliberately declared by NO app, so the test suite can prove that knowing a
    # dataset's name is not access.

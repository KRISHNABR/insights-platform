# The stub corporate directory. The brief says "assume corporate SSO exists - stub it",
# so this is the whole IdP: a list of people and the groups they are in.
#
# Real SSO changes how the edge LEARNS these facts. It does not change anything
# downstream, because everything downstream consumes the edge's assertion, not the IdP.
#
# Four users, each earning their place in a test or a demo:
users:
  krishna@corp.example:
    name: Krishna Murari
    groups: [MG-PEOPLE-OPS, headcount-viewer]

  vidya@corp.example:
    name: Vidya Raman
    # Owns the restricted dataset and holds the role that unmasks it.
    groups: [MG-PEOPLE-ANALYTICS, comp-analyst]

  lokesh@corp.example:
    name: Lokesh Iyer
    # Deliberately NOT a comp-analyst. Reaches the restricted dataset, sees it masked.
    # They are the proof that entitlement and field-level access are different questions.
    groups: [MG-PEOPLE-ANALYTICS]

  suraj@corp.example:
    name: Suraj Pillai
    # Platform team. Note what they do NOT have: membership of any tenant's groups,
    # and no standing access to any dataset (ADR-003).
    groups: [MG-PLATFORM]

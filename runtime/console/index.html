<!doctype html>
<meta charset="utf-8">
<title>Insights Hub</title>
<style>
  :root {
    --page:#f4f2f0; --surface:#ffffff; --line:#e4e0dd; --line-soft:#efecea;
    --pink:#c8368f; --pink-dark:#a82a76; --pink-wash:#fdf4fa;
    --text:#26222b; --dim:#767078; --muted:#a29ca6;
    --ok:#2f7d4f; --warn:#9a6212; --bad:#c0392b;
    --shadow:0 1px 2px rgba(38,34,43,.04), 0 2px 10px rgba(38,34,43,.05);
    --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--page); color:var(--text); font:15px/1.55 var(--sans) }

  /* top bar */
  .topbar { background:var(--surface); border-bottom:1px solid var(--line);
            height:58px; display:flex; align-items:center; padding:0 24px; gap:18px }
  .brand { font-size:16px; font-weight:600; color:var(--pink); cursor:pointer;
           letter-spacing:.01em }
  .user { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:14px }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--pink);
            color:#fff; display:flex; align-items:center; justify-content:center;
            font-size:12px; font-weight:600; letter-spacing:.03em }
  .user .groups { color:var(--muted); font-size:12px }

  /* shell */
  .shell { display:flex; min-height:calc(100vh - 58px) }
  .side { width:86px; background:var(--surface); border-right:1px solid var(--line);
          padding:18px 0; display:flex; flex-direction:column; gap:4px; flex:0 0 auto }
  .side button { background:none; border:0; cursor:pointer; font:inherit; font-size:11px;
                 color:var(--dim); padding:11px 4px; display:flex; flex-direction:column;
                 align-items:center; gap:6px; border-left:3px solid transparent }
  .side button svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.6 }
  .side button:hover { color:var(--text) }
  .side button[aria-selected="true"] { color:var(--pink); border-left-color:var(--pink) }
  main { flex:1; padding:30px 34px; min-width:0 }

  h2.greet { font-size:25px; font-weight:600; margin:0 0 24px; letter-spacing:-.01em }
  .crumb { color:var(--dim); font-size:13px; margin:0 0 4px }
  .crumb b { color:var(--text) }
  h2.title { font-size:22px; font-weight:600; margin:0 0 20px }

  /* cards */
  .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)) }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:7px;
          padding:18px 20px 16px; display:flex; flex-direction:column; gap:9px;
          min-height:152px; box-shadow:var(--shadow); position:relative }
  .card.mine-card { border-left:4px solid var(--pink) }
  .card.idle { background:#faf9f8; border-style:dashed; box-shadow:none }
  .card.idle .name, .card.idle .desc { color:var(--muted) }
  .name { font-size:15px; font-weight:600 }
  .desc { color:var(--dim); font-size:13px; line-height:1.5 }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:2px }
  .chip { border:1px solid var(--line); border-radius:4px; padding:2px 8px;
          font-size:11px; color:var(--dim); font-family:var(--mono) }
  .chip.pink { border-color:var(--pink); color:var(--pink); background:var(--pink-wash) }
  .cardfoot { margin-top:auto; padding-top:13px; display:flex; align-items:center; gap:10px }
  .pill { border:0; border-radius:999px; padding:5px 17px; font:inherit; font-size:13px;
          cursor:pointer; background:var(--pink); color:#fff }
  .pill:hover { background:var(--pink-dark) }
  .pill.ghost { background:none; border:1px solid var(--line); color:var(--muted);
                cursor:default }
  .state { margin-left:auto; color:var(--muted); font-size:12px; display:flex;
           align-items:center; gap:6px }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block }
  .dot.on { background:var(--ok) } .dot.off { background:var(--line) }
  .dot.warn { background:var(--warn) }

  /* panels, tables, detail */
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:7px;
           padding:20px 22px; box-shadow:var(--shadow) }
  .tabs { display:flex; gap:26px; border-bottom:1px solid var(--line); margin:0 0 22px }
  .tabs button { background:none; border:0; border-bottom:2px solid transparent;
                 padding:0 0 11px; cursor:pointer; font:inherit; font-size:14px;
                 color:var(--dim) }
  .tabs button[aria-selected="true"] { color:var(--pink); border-bottom-color:var(--pink) }
  table { border-collapse:collapse; width:100%; font-size:13px; font-family:var(--mono) }
  th { text-align:left; color:var(--dim); font-weight:500; padding:7px 14px 7px 0;
       border-bottom:1px solid var(--line); white-space:nowrap; font-family:var(--sans) }
  td { padding:9px 14px 9px 0; border-bottom:1px solid var(--line-soft); vertical-align:top }
  .note { color:var(--dim); font-size:13px; margin:0 0 18px; max-width:76ch }
  .empty { color:var(--muted); padding:34px 0; font-size:14px }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:12.5px;
        font-family:var(--mono); background:#fbfaf9; border:1px solid var(--line);
        border-radius:6px; padding:16px; max-height:62vh; overflow:auto; line-height:1.6 }
  .row { display:flex; gap:30px; flex-wrap:wrap; margin-bottom:20px }
  .kv b { color:var(--dim); font-weight:500; margin-right:7px; font-size:13px }
  iframe { width:100%; height:66vh; border:1px solid var(--line); border-radius:7px;
           background:#fff }
  a { color:var(--pink) }
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .dim{color:var(--dim)}
  button.action { background:var(--pink); border:0; color:#fff; padding:8px 18px;
        border-radius:999px; cursor:pointer; font:inherit; font-size:13px }
  button.action[disabled] { background:var(--line); color:var(--muted); cursor:not-allowed }
</style>

<div class="topbar">
  <span class="brand" id="home">Insights Hub</span>
  <span class="user">
    <span class="avatar" id="avatar">–</span>
    <span><span id="uname">…</span><br><span class="groups" id="ugroups"></span></span>
  </span>
</div>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="view"><div class="empty">loading…</div></main>
</div>

<script>
const view  = document.getElementById('view');
const side  = document.getElementById('side');
const get   = (p) => fetch(p).then(r => r.json());
const esc   = (s) => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const ago   = (ts) => {
  if (!ts) return 'never run';
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 90) return Math.round(s) + 's ago';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
};
let ME = {subject:'', groups:[], trusted:false};
let APP = null;

const ICONS = {
  Home: '<path d="M3 9.5 10 3l7 6.5V17a1 1 0 0 1-1 1h-3v-5H7v5H4a1 1 0 0 1-1-1z"/>',
  Connections: '<path d="M7 10h6M10 4v3M10 13v3"/><circle cx="10" cy="10" r="2.2"/><circle cx="10" cy="3" r="1.6"/><circle cx="10" cy="17" r="1.6"/>',
  Runs: '<circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2"/>',
  Telemetry: '<path d="M3 16V9M8 16V5M13 16v-5M18 16v-8"/>',
};

function sidebar(active, onPick) {
  side.innerHTML = Object.keys(ICONS).map(n =>
    `<button data-t="${n}" aria-selected="${n === active}">
       <svg viewBox="0 0 20 20" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>
       ${n}</button>`).join('');
  side.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => onPick(b.dataset.t)));
}

const firstName = (email) => {
  const n = (email || '').split('@')[0].split('.')[0];
  return n ? n[0].toUpperCase() + n.slice(1) : 'there';
};

/* ------------------------------------------------------------------ HOME -- */
const HOME = {
  async Home() {
    const apps = await get('api/apps');
    const mine = apps.filter(a => a.mine), other = apps.filter(a => !a.mine);

    const card = (a, yours) => {
      const running = a.kind === 'web' && a.port;
      const desc = a.kind === 'job'
        ? `Scheduled job for ${esc(a.team)}. Runs ${esc(a.schedule || 'on demand')}.`
        : `Web app for ${esc(a.team)}. ${running ? 'Running now.' : 'Not running locally.'}`;
      const conns = (a.connections || []).map(c =>
        `<span class="chip">${esc(c.name ?? c)}${c.engine ? ' · ' + esc(c.engine) : ''}</span>`
      ).join('') || '<span class="chip">no connections</span>';
      return `<div class="card ${yours ? 'mine-card' : ''} ${running || a.kind === 'job' ? '' : 'idle'}">
          <div class="name">${esc(a.name)}</div>
          <div class="desc">${desc}</div>
          <div class="chips">${conns}</div>
          <div class="cardfoot">
            <button class="pill" data-app="${esc(a.name)}">Open</button>
            <span class="state"><span class="dot ${a.kind === 'job' ? 'warn' : (running ? 'on' : 'off')}"></span>
              ${a.recent_problems ? `<span class="warn">${a.recent_problems} problem${a.recent_problems > 1 ? 's' : ''}</span>` : esc(ago(a.last_seen))}</span>
          </div>
        </div>`;
    };

    return `<h2 class="greet">Hey ${esc(firstName(ME.subject))}, welcome to Insights Hub</h2>
      <p class="note">Apps with a pink edge are yours &mdash; your corporate groups matched
        against each app's <code>access.manage</code>. Everything else on the hub is listed
        below it, because a platform you cannot see the shape of is one nobody trusts.</p>
      ${mine.length ? `<div class="grid">${mine.map(a => card(a, true)).join('')}</div>` : ''}
      ${other.length ? `<h3 class="note" style="margin:30px 0 12px">Everything else on the hub</h3>
        <div class="grid">${other.map(a => card(a, false)).join('')}</div>` : ''}`;
  },

  async Connections() {
    const rows = await get('api/connections');
    if (!rows.length) return '<h2 class="title">Connections</h2><div class="empty">Nothing has connected yet &mdash; run an app first.</div>';
    return `<h2 class="title">Connections</h2>
      <p class="note">Every connection the fleet has actually opened. <b>Likely owner</b>
        reads the failure kind: <code>auth</code> and <code>not_found</code> are the team's,
        <code>tls</code> and <code>network</code> are usually the platform's. Counts and
        timings only &mdash; never a row.</p>
      <div class="panel"><table>
        <tr><th>app</th><th>connection</th><th>engine</th><th>queries</th><th>failures</th>
            <th>avg ms</th><th>rows</th><th>kinds</th><th>likely owner</th></tr>
        ${rows.map(c => `<tr><td>${esc(c.app)}</td><td>${esc(c.connection)}</td>
          <td class="dim">${esc(c.engine)}</td><td>${c.queries}</td>
          <td class="${c.failures ? 'bad' : 'dim'}">${c.failures}</td>
          <td class="dim">${c.avg_ms ?? '—'}</td><td class="dim">${c.rows}</td>
          <td>${Object.entries(c.failure_kinds).map(([k, n]) => `<span class="chip">${esc(k)} ×${n}</span>`).join('') || '<span class="dim">—</span>'}</td>
          <td class="${c.likely_owner === 'platform' ? 'warn' : 'dim'}">${c.likely_owner ?? '—'}</td>
        </tr>`).join('')}</table></div>`;
  },

  async Runs() {
    const rows = await get('api/runs');
    if (!rows.length) return '<h2 class="title">Runs</h2><div class="empty">No scheduled runs yet.</div>';
    return `<h2 class="title">Runs</h2>
      <p class="note">From the scheduler's own state, not from logs &mdash; a run that died
        before emitting anything still appears. <b>Abandoned</b> means the scheduler
        restarted while it was in flight.</p>
      <div class="panel"><table>
        <tr><th>app</th><th>scheduled for</th><th>run id</th><th>started</th><th>status</th></tr>
        ${rows.map(r => `<tr><td>${esc(r.app)}</td><td class="dim">${esc(r.scheduled_for)}</td>
          <td class="dim">${esc(r.run_id)}</td><td class="dim">${esc(ago(r.started_at))}</td>
          <td class="${({ok:'ok',failed:'bad',abandoned:'warn',running:'dim'})[r.status]}">${esc(r.status)}</td>
        </tr>`).join('')}</table></div>`;
  },

  async Telemetry() {
    const [e, a] = await Promise.all([get('api/logs?stream=events&limit=70'), get('api/logs?stream=audit&limit=30')]);
    const all = [...e, ...a].sort((x, y) => (x.ts || '').localeCompare(y.ts || '')).slice(-90).reverse();
    if (!all.length) return '<h2 class="title">Telemetry</h2><div class="empty">Nothing recorded yet.</div>';
    const common = new Set(['ts','stream','level','event','env','caller','request_id','sdk','app','team']);
    return `<h2 class="title">Telemetry</h2>
      <p class="note">Every record carries who, which app, and the shape of what happened
        &mdash; never a payload. The SDK's logger raises rather than emit one.</p>
      <div class="panel"><table>
        <tr><th>time</th><th>app</th><th>caller</th><th>event</th><th>detail</th></tr>
        ${all.map(r => {
          const extra = Object.entries(r).filter(([k, v]) => !common.has(k) && v !== null)
            .map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' ');
          return `<tr><td class="dim">${esc((r.ts || '').slice(11, 19))}</td><td>${esc(r.app)}</td>
            <td class="dim">${esc(r.caller)}</td>
            <td class="${({warn:'warn',error:'bad'})[r.level] || ''}">${esc(r.event)}</td>
            <td class="dim">${esc(extra)}</td></tr>`;
        }).join('')}</table></div>`;
  },
};

/* -------------------------------------------------------------- APP VIEW -- */
const DETAIL = {
  async Overview() {
    const d = APP, open = `../${d.name}/`;
    const head = `<div class="row">
        <span class="kv"><b>kind</b>${esc(d.kind)}</span>
        <span class="kv"><b>team</b>${esc(d.team)}</span>
        ${d.schedule ? `<span class="kv"><b>schedule</b>${esc(d.schedule)}</span>` : ''}
        <span class="kv"><b>your access</b>${d.you.is_owner ? 'owner' : d.you.is_contributor ? 'contributor' : 'reader'}</span>
      </div>`;
    if (d.kind === 'web') {
      return head + (d.running
        ? `<p class="note">Served through the platform's front door &mdash; same session, same
             group check. <a href="${open}" target="_blank">Open in a new tab ↗</a></p>
           <iframe src="${open}"></iframe>`
        : `<div class="empty">Not running. Start it in its own repo:<br><br>
             <code>cd insights-${esc(d.name)} &amp;&amp; uv run insights serve</code></div>`);
    }
    return head + `<p class="note">A scheduled job. It runs on its cron, and you can run it
        now if you are a contributor or an owner &mdash; running is an action, not a view.</p>
      <button class="action" id="run" ${d.you.is_contributor ? '' : 'disabled'}>Run now</button>
      ${d.you.is_contributor ? '' : '<span class="dim" style="margin-left:10px">you are a reader on this app</span>'}
      <div id="runout" style="margin-top:20px"></div>`;
  },

  async Connections() {
    const d = APP;
    if (!d.connections.length) return '<div class="empty">This app declares no connections.</div>';
    return `<p class="note"><code>secret</code> is a NAME. Its value lives in the secret store
        &mdash; written by the owning team, readable by the app's own identity, and by nobody
        on the platform team.</p>
      <div class="panel"><table>
        <tr><th>name</th><th>engine</th><th>secret</th><th>local override</th></tr>
        ${d.connections.map(c => `<tr><td>${esc(c.name)}</td><td class="dim">${esc(c.engine)}</td>
          <td>${c.secret ? `<span class="chip pink">${esc(c.secret)}</span>` : '<span class="dim">none</span>'}</td>
          <td class="dim">${c.local ? 'yes' : '—'}</td></tr>`).join('')}</table></div>`;
  },

  async ['app.yaml']() {
    return `<p class="note">The only configuration this app has. Safe to show: the manifest
        loader refuses a credential anywhere in it.</p><pre>${esc(APP.manifest)}</pre>`;
  },

  async Telemetry() {
    const d = APP;
    if (!d.recent.length) return '<div class="empty">Nothing recorded for this app yet.</div>';
    const common = new Set(['ts','stream','level','event','env','caller','request_id','sdk','app','team']);
    return `<div class="row"><span class="kv"><b>events</b>${d.telemetry.events}</span>
        <span class="kv"><b>queries</b>${d.telemetry.queries}</span>
        <span class="kv"><b>failures</b>${d.telemetry.failures}</span></div>
      <div class="panel"><table><tr><th>time</th><th>caller</th><th>event</th><th>detail</th></tr>
        ${d.recent.slice().reverse().map(r => {
          const extra = Object.entries(r).filter(([k, v]) => !common.has(k) && v !== null)
            .map(([k, v]) => `${k}=${v}`).join(' ');
          return `<tr><td class="dim">${esc((r.ts || '').slice(11, 19))}</td>
            <td class="dim">${esc(r.caller)}</td>
            <td class="${({warn:'warn',error:'bad'})[r.level] || ''}">${esc(r.event)}</td>
            <td class="dim">${esc(extra)}</td></tr>`;
        }).join('')}</table></div>`;
  },
};

async function runJob() {
  const out = document.getElementById('runout'), btn = document.getElementById('run');
  btn.disabled = true; btn.textContent = 'running…'; out.innerHTML = '';
  try {
    const res = await fetch(`api/apps/${APP.name}/run`, {method: 'POST'});
    const body = await res.json();
    if (!res.ok) {
      out.innerHTML = `<p class="bad">${esc(body.error)}</p><p class="note">${esc(body.hint || '')}</p>`;
    } else {
      const step = (r) => {
        const extra = Object.entries(r).filter(([k]) =>
          ['connection','engine','rows','ms','output','departments','people'].includes(k))
          .map(([k, v]) => `${k}=${v}`).join(' ');
        return `<tr><td class="${({warn:'warn',error:'bad'})[r.level] || 'ok'}">${esc(r.event)}</td>
                <td class="dim">${esc(extra)}</td></tr>`;
      };
      out.innerHTML = `<p class="${body.exit_code ? 'bad' : 'ok'}">exit ${body.exit_code}
          <span class="dim">· triggered by ${esc(body.triggered_by)}</span></p>
        <div class="panel"><table><tr><th>step</th><th>detail</th></tr>
          ${body.events.map(step).join('')}</table></div>
        ${body.stderr.length ? `<pre class="bad">${esc(body.stderr.join('\n'))}</pre>` : ''}`;
    }
  } catch (e) { out.innerHTML = `<p class="bad">${esc(e)}</p>`; }
  btn.disabled = false; btn.textContent = 'Run now';
}

/* ---------------------------------------------------------------- ROUTER -- */
async function showHome(tab = 'Home') {
  APP = null;
  sidebar(tab, showHome);
  view.innerHTML = '<div class="empty">loading…</div>';
  view.innerHTML = await HOME[tab]();
  view.querySelectorAll('[data-app]').forEach(el =>
    el.addEventListener('click', () => showApp(el.dataset.app)));
}

async function showApp(name, tab = 'Overview') {
  APP = await get(`api/apps/${name}`);
  if (APP.error) { view.innerHTML = `<div class="empty bad">${esc(APP.error)}</div>`; return; }
  sidebar(null, showHome);
  const names = Object.keys(DETAIL);
  view.innerHTML = `<p class="crumb"><a href="#" id="back">Home</a> / <b>${esc(name)}</b></p>
    <h2 class="title">${esc(name)}</h2>
    <div class="tabs">${names.map(n =>
      `<button data-t="${n}" aria-selected="${n === tab}">${n}</button>`).join('')}</div>
    <div id="pane"><div class="empty">loading…</div></div>`;
  document.getElementById('back').addEventListener('click', (e) => { e.preventDefault(); showHome(); });
  view.querySelectorAll('.tabs button').forEach(b =>
    b.addEventListener('click', () => showApp(name, b.dataset.t)));
  document.getElementById('pane').innerHTML = await DETAIL[tab]();
  const btn = document.getElementById('run');
  if (btn) btn.addEventListener('click', runJob);
}

document.getElementById('home').addEventListener('click', () => showHome());

get('api/me').then(me => {
  ME = me;
  const name = firstName(me.subject);
  document.getElementById('uname').textContent = me.trusted ? name : 'not signed in';
  document.getElementById('ugroups').textContent = (me.groups || []).join(', ');
  document.getElementById('avatar').textContent =
    me.trusted ? (me.subject[0] + (me.subject.split('@')[0].split('.')[1] || 'x')[0]).toUpperCase() : '–';
  showHome();
});
</script>
